<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Squircle Shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.32"/>
    </filter>

    <!-- Subtle Highlight Rim -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Badge Shadow -->
    <filter id="badgeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Highlight Rim -->
  <rect x="38" y="38" width="436" height="436" rx="102" fill="none" stroke="url(#highlight)" stroke-width="2.5"/>

  <!-- Centered Link Icon (exact geometry from icons/icon.svg) -->
  <!-- Soft Under-glow / Depth shadow behind link -->
  <g transform="translate(250, 256) scale(18.5) translate(-8, -8)" opacity="0.2">
    <path stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
          d="M6.8 9.5a3 3 0 0 0 4.24.2l2.1-2.1a3 3 0 0 0-4.24-4.24l-.8.8"/>
    <path stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
          d="M9.2 7.1a3 3 0 0 0-4.24-.2l-2.1 2.1a3 3 0 0 0 4.24 4.24l.8-.8"/>
  </g>

  <!-- Main Crisp White Link -->
  <g transform="translate(250, 250) scale(18.5) translate(-8, -8)">
    <path stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"
          d="M6.8 9.2a3 3 0 0 0 4.24.2l2.1-2.1a3 3 0 0 0-4.24-4.24l-.8.8"/>
    <path stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"
          d="M9.2 6.8a3 3 0 0 0-4.24-.2l-2.1 2.1a3 3 0 0 0 4.24 4.24l.8-.8"/>
  </g>

  <!-- Green Copied Checkmark Badge -->
  <g transform="translate(390, 390)" filter="url(#badgeShadow)">
    <!-- White outer rim for crisp separation -->
    <circle cx="0" cy="0" r="66" fill="#ffffff"/>
    <circle cx="0" cy="0" r="59" fill="url(#badgeGrad)"/>
    <!-- Checkmark (exact geometry from icons/check.svg) -->
    <g transform="translate(-39, -39) scale(4.9)">
      <path stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
            d="M2.5 8.5l4 4 7-9"/>
    </g>
  </g>
</svg>
